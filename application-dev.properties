# ===============================================
# CHRONICARE BACKEND - DEVELOPMENT ENVIRONMENT
# ===============================================

# Server Configuration
server.port=${PORT:11083}

# Application Info
spring.application.name=ChroniCare Backend - Development

# Database Configuration - MySQL (Development)
# Valores por defecto para desarrollo (puedes sobreescribir con variables de entorno)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:dbchronicaree_backend}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration - Development (show SQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration - Development (verbose)
logging.level.root=INFO
logging.level.com.chronicare.platform=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring Boot Actuator - Development (all endpoints enabled)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.db.enabled=true

# JWT Configuration - Development
jwt.secret.key=${JWT_SECRET:dev-secret-key-chronicare-2024-change-in-production}
jwt.time.expiration=86400000

# Datasource Pool - Development
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# CORS Configuration - Development (allow all)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:11083}

# File Upload - Development
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Error Configuration - Development (show details)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Spring DevTools - Development
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Profile
# Note: Do not set spring.profiles.active in profile-specific files (causes errors during startup). Use -Dspring-boot.run.profiles=dev when running with Maven.
