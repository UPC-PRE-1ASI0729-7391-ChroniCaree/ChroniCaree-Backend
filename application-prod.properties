# ===============================================
# CHRONICARE BACKEND - PRODUCTION ENVIRONMENT
# ===============================================

# Server Configuration
server.port=${PORT:8080}

# Application Info
spring.application.name=ChroniCare Backend - Production

# Database Configuration - MySQL (Production)
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&requireSSL=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration - Production (no SQL logs)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Logging Configuration - Production (minimal)
logging.level.root=WARN
logging.level.com.chronicare.platform=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Spring Boot Actuator - Production (limited endpoints)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# JWT Configuration - Production
jwt.secret.key=${JWT_SECRET}
jwt.time.expiration=86400000

# Datasource Pool - Production (optimized)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# CORS Configuration - Production (specific origins)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://chronicare.app,https://www.chronicare.app,https://admin.chronicare.app}

# File Upload - Production
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Error Configuration - Production (hide details)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Security Headers - Production
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Compression - Production
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Profile
spring.profiles.active=prod
