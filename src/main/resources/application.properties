spring.application.name=chronicare-backend

# Spring DataSource Configuration for MySQL
# Railway uses MYSQL_URL which might lack 'jdbc:' prefix, so we construct it manually
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:dbchronicaree_backend}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=false

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.naming.physical-strategy=com.chronicare.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Elements take their values from maven pom.xml build-related information
documentation.application.description=ChroniCare Healthcare Platform - Backend API for managing medical records, appointments, and patient care
documentation.application.version=1.0.0

server.port=${PORT:8080}

logging.level.org.hibernate.SQL=${LOGGING_LEVEL_HIBERNATE_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_HIBERNATE_BINDER:TRACE}
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.chronicare=${LOGGING_LEVEL_APP:INFO}

# === Springdoc OpenAPI / Swagger ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.disable-swagger-default-url=true

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,http://localhost:11083}
cors.allowed.methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
cors.allowed.headers=${CORS_ALLOWED_HEADERS:*}
cors.allow.credentials=${CORS_ALLOW_CREDENTIALS:true}

# JWT Configuration
# Use environment variables in production for security
authorization.jwt.secret=${JWT_SECRET:mySecretKeyForJwtTokenGenerationWhichShouldBeLongEnough}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# === Actuator Configuration (for health checks) ===
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
# Temporarily disable DB health during deploy so /actuator/health returns 200
management.health.db.enabled=false

# ====== Temporary verbose logging to diagnose startup ======
logging.level.root=INFO
logging.level.com.chronicare=DEBUG
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
