spring.application.name=chronicare-backend

 
spring.datasource.url=jdbc:mariadb://localhost:3306/dbchronicaree_backend
spring.datasource.username=uchronicaree_backend
spring.datasource.password=123456
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Opciones: none | validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

server.port=11083

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Elements take their values from maven pom.xml build-related information
documentation.application.description=ChroniCare Healthcare Platform - Backend API for managing medical records, appointments, and patient care
documentation.application.version=1.0.0

server.port=11083

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# === Springdoc OpenAPI / Swagger ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.disable-swagger-default-url=true

# JWT Configuration
authorization.jwt.secret=mySecretKeyForJwtTokenGenerationWhichShouldBeLongEnough
authorization.jwt.expiration.days=7
